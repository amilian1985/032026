<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Video RA con MindAR</title>
    
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
    
    <script>
      AFRAME.registerComponent('controlador-video', {
        init: function () {
          const video = document.querySelector('#mi-video');
          
          this.el.addEventListener('targetFound', event => {
            video.play();
          });
          
          this.el.addEventListener('targetLost', event => {
            video.pause();
          });
        }
      });
    </script>
    
    <style>
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  
  <body>
    <a-scene mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="mi-video" src="video-efecto.mp4" preload="auto" loop="true" playsinline webkit-playsinline crossorigin="anonymous"></video>
      </a-assets>
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      
      
        <a-video src="#mi-video" width="1" height="0.56" position="0 0 0" rotation="0 0 0"></a-video>
      
      
    </a-scene>
  </body>
</html>
