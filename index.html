<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://jsdelivr.net"></script>
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
  </head>
  <body>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Vinculamos tu archivo de video exacto -->
        <video id="videoPintura" src="./032026.mp4" preload="auto" loop="true" playsinline webkit-playsinline muted></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      
        <!-- El plano de video que se superpone a la pintura -->
        <a-video src="#videoPintura" position="0 0 0" height="0.552" width="1" rotation="0 0 0"></a-video>
      

    </a-scene>

    <script>
      const target = document.querySelector('#contenedorTarget');
      const video = document.querySelector('#videoPintura');

      // Control de reproducción automática al detectar/perder la pintura
      target.addEventListener("targetFound", () => {
        video.play();
      });

      target.addEventListener("targetLost", () => {
        video.pause();
      });
    </script>

  </body>
</html>
