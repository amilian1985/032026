<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://jsdelivr.net"></script>
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
  </head>
  <body>

    <!-- Añadimos una etiqueta de video HTML oculta para streaming directo -->
    <video id="videoPintura" src="./032026.mp4" preload="auto" loop="true" playsinline webkit-playsinline muted style="display:none;"></video>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF:0.001; filterBeta: 1000;" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      
        <!-- Vinculamos directamente el ID del video oculto -->
        <a-video src="#videoPintura" position="0 0 0" height="0.552" width="1" rotation="0 0 0"></a-video>
      

    </a-scene>

    <script>
      const target = document.querySelector('#contenedorTarget');
      const video = document.querySelector('#videoPintura');

      // Intentar forzar la carga inicial del video
      video.load();

      target.addEventListener("targetFound", () => {
        video.play().catch(err => console.log("Error al reproducir:", err));
      });

      target.addEventListener("targetLost", () => {
        video.pause();
      });
    </script>

  </body>
</html>
